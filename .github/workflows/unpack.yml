name: Unpack Fantasyak ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Unpack project
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf /tmp/fantasyak-unpack
          mkdir -p /tmp/fantasyak-unpack

          unzip -q "$ZIP_FILE" -d /tmp/fantasyak-unpack

          echo "Extracted files:"
          ls -la /tmp/fantasyak-unpack

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/fantasyak-unpack/ ./

          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Fantasyak project from ZIP"
          git push
